<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RutaMerch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ground:#eef0f4;--surface:#fff;--surface-2:#f7f8fb;--surface-3:#eef1f6;
    --ink:#161922;--ink-soft:#39414f;--muted:#69738a;--faint:#97a0b3;
    --border:#e2e6ee;--border-strong:#d2d8e4;
    --brand:#2f56d9;--brand-weak:#e7edfc;--brand-ink:#1e3fae;
    --teal:#0f9d8f;--teal-weak:#dcf5f1;--teal-ink:#0a6f65;
    --amber:#dd8709;--amber-weak:#fbeecf;--amber-ink:#9c5f05;
    --green:#12a150;--green-weak:#d9f6e4;--green-ink:#0a7a3b;--red:#dc3a3a;--red-weak:#fbe3e3;
    --role:var(--brand);--role-weak:var(--brand-weak);--role-ink:var(--brand-ink);
    --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.05);--shadow-lg:0 8px 40px rgba(20,25,40,.16);
    --r:14px;--r-sm:10px;--fdisp:'Archivo',system-ui,sans-serif;--fbody:'Manrope',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0e1016;--surface:#171b24;--surface-2:#1e232e;--surface-3:#252b38;
    --ink:#f1f3f8;--ink-soft:#cdd3df;--muted:#98a1b3;--faint:#6b7488;--border:#2a303c;--border-strong:#39414f;
    --brand:#6f8dff;--brand-weak:#1e2740;--brand-ink:#adbeff;--teal:#3ec8b8;--teal-weak:#123030;--teal-ink:#6fe0d2;
    --amber:#f0a839;--amber-weak:#33280f;--amber-ink:#f6c775;--green:#3ec07a;--green-weak:#12301f;--green-ink:#74dd9f;--red:#f26666;--red-weak:#3a1c1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);--shadow-lg:0 8px 40px rgba(0,0,0,.5);
  }}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--fbody);-webkit-font-smoothing:antialiased;line-height:1.45}
  h1,h2,h3{font-family:var(--fdisp);margin:0;line-height:1.15;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}.tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--role);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(20,25,40,.16)}
  .brand{font-family:var(--fdisp);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:#fff;opacity:.9}
  .brand small{display:block;font-size:10.5px;font-weight:600;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
  .refresh{margin-left:auto;background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:16px}
  .subbar{position:sticky;top:62px;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:8px;font-family:var(--fdisp);white-space:nowrap}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .pick{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 8px}
  .pick label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-family:var(--fdisp)}
  .pick select,.pick input{border:none;background:transparent;color:var(--ink);font-weight:600;font-size:13.5px;outline:none;font-family:var(--fbody);max-width:150px}
  .body{padding:16px 16px 48px}
  .btn{border:1px solid transparent;border-radius:11px;font-weight:700;font-size:14px;padding:11px 16px;font-family:var(--fdisp);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:-.01em}
  .btn.primary{background:var(--role);color:#fff}.btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}.btn.xs{padding:6px 10px;font-size:12px;border-radius:8px}
  .btn.block{width:100%}.btn.danger{background:var(--red-weak);color:var(--red)}.btn[disabled]{opacity:.5;pointer-events:none}.push{margin-left:auto}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--fdisp);font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:6px}
  .stat.accent .n{color:var(--role)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}.pad{padding:16px}
  .group{margin-bottom:20px}.group-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
  .avatar{width:34px;height:34px;border-radius:10px;background:var(--role-weak);color:var(--role-ink);font-family:var(--fdisp);font-weight:800;font-size:14px;display:grid;place-items:center;flex-shrink:0}
  .group-head .nm{font-family:var(--fdisp);font-weight:700;font-size:15.5px}.group-head .meta{font-size:12px;color:var(--muted)}
  .count-pill{margin-left:auto;background:var(--surface-3);color:var(--ink-soft);font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;font-family:var(--fdisp)}
  .task{padding:14px;border-radius:var(--r);margin-bottom:10px;border-left:3px solid var(--border-strong)}
  .task.s1{border-left-color:var(--faint)}.task.s2{border-left-color:var(--brand)}.task.s3{border-left-color:var(--green)}
  .t-top{display:flex;align-items:flex-start;gap:10px}.pdv{font-family:var(--fdisp);font-weight:700;font-size:15px}
  .addr{font-size:12.5px;color:var(--muted);margin-top:2px}.addr a{color:var(--role);text-decoration:none;font-weight:600}
  .desc{font-size:13.5px;color:var(--ink-soft);margin-top:9px;line-height:1.5}
  .mat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .mat{display:inline-flex;align-items:center;gap:6px;background:var(--amber-weak);color:var(--amber-ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600}
  .mat b{font-family:var(--fdisp);font-weight:800}
  .t-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;align-items:center}
  .badge{font-family:var(--fdisp);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:7px;white-space:nowrap}
  .chain{font-family:var(--fdisp);font-weight:800;font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-soft)}
  .chain.TAMBO{background:#fde5e5;color:#b02323}.chain.OXXO{background:#fde4d6;color:#b5560f}.chain.REPSOL{background:#fdecd2;color:#a06a06}.chain.PRIMAX{background:#dcf3e2;color:#127a3b}
  .time-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);color:var(--ink-soft);font-family:var(--fdisp);font-weight:700;font-size:12px;padding:3px 8px;border-radius:7px}
  .st1{background:var(--surface-3);color:var(--muted)}.st2{background:var(--brand-weak);color:var(--brand-ink)}.st3{background:var(--green-weak);color:var(--green-ink)}
  .wh0{background:var(--surface-3);color:var(--muted)}.wh1{background:var(--amber-weak);color:var(--amber-ink)}.wh2{background:var(--green-weak);color:var(--green-ink)}
  .prog{height:8px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-top:9px}.prog>i{display:block;height:100%;background:var(--green);border-radius:6px}
  .mini{display:flex;gap:12px;margin-top:9px}.mini span{font-size:12px;color:var(--muted);font-weight:600}.mini b{font-family:var(--fdisp);color:var(--ink)}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}.list-row:last-child{border-bottom:none}
  .list-row .nm{font-family:var(--fdisp);font-weight:700;font-size:14.5px}.list-row .sub{font-size:12px;color:var(--muted)}
  .qbox{font-family:var(--fdisp);font-weight:800;background:var(--role-weak);color:var(--role-ink);border-radius:9px;padding:6px 12px;font-size:16px;min-width:44px;text-align:center}
  .sech{font-family:var(--fdisp);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 2px 10px}
  .empty{text-align:center;padding:44px 24px;color:var(--muted)}.empty .ico{font-size:40px;opacity:.5;margin-bottom:8px}.empty h3{font-size:16px;color:var(--ink);margin-bottom:5px}.empty p{font-size:13.5px;max-width:40ch;margin:0 auto;line-height:1.55}
  .empty code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:12px}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-weight:600}
  .spin{width:34px;height:34px;border:3px solid var(--surface-3);border-top-color:var(--role);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-family:var(--fdisp)}
  .field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--border);border-radius:11px;padding:12px 13px;font-size:15px;color:var(--ink);outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--role);background:var(--surface);box-shadow:0 0 0 3px var(--role-weak)}
  .field textarea{resize:vertical;min-height:60px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .matadd{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:8px;align-items:stretch}
  .matadd>div{min-width:0}
  .matadd select,.matadd input{width:100%;min-width:0;height:46px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:11px;padding:0 11px;font-size:14.5px;color:var(--ink);outline:none;font-family:var(--fbody);text-overflow:ellipsis}
  .matadd select:focus,.matadd input:focus{border-color:var(--role);background:var(--surface);box-shadow:0 0 0 3px var(--role-weak)}
  .matadd .btn{height:46px;padding:0 15px}
  .draftmat{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:8px}
  .draftmat .q{font-family:var(--fdisp);font-weight:800;background:var(--role-weak);color:var(--role-ink);border-radius:7px;padding:2px 8px;font-size:13px}
  .draftmat .x{margin-left:auto;background:var(--red-weak);color:var(--red);border:none;width:28px;height:28px;border-radius:8px;font-size:15px;font-weight:700}
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(15,18,28,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:560px){.overlay{align-items:center}}
  .sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);padding:22px}
  @media(min-width:560px){.sheet{border-radius:20px}}
  .sheet-head{display:flex;align-items:center;margin-bottom:18px}.sheet-head h2{font-size:19px}
  .iconx{background:var(--surface-3);color:var(--ink);border:none;width:38px;height:38px;border-radius:10px;font-size:18px}
  .filebtn{position:relative;overflow:hidden;display:inline-flex}.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:200px}
  .imp-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-top:12px;font-size:13px}
  .hint{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}
  .banner{background:var(--amber-weak);color:var(--amber-ink);border-radius:11px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
var API='/api/exec';
var app=document.getElementById('app');
var CH=['TAMBO','OXXO','REPSOL','PRIMAX','Otro'];
var WH=['Por preparar','Preparado','Entregado'];
var ACTIVOS=['Cigarrera','Dispenser','Glorificador'];
var TIPOS=['Instalación','Mantenimiento eléctrico','Mantenimiento de cigarrera','Cambio de cigarrera','Cambio de brazo hidráulico','Mantenimiento de dispenser','Cambio de dispenser','Cambio de placa','Cambio luz LED','Aterramiento','Retiro','Reubicación','Validación','Otros'];
var TIPO_MATS={
 'Mantenimiento eléctrico':[{name:'Transformador eléctrico',qty:1},{name:'Luces LED',qty:2}],
 'Cambio de brazo hidráulico':[{name:'Brazo hidráulico',qty:1},{name:'Bisagra',qty:2}],
 'Cambio de placa':[{name:'Placas',qty:1}],
 'Instalación':[{name:'Parantes',qty:2},{name:'Tarugos',qty:4},{name:'Canaletas',qty:2}],
 'Cambio de dispenser':[{name:'Dispenser mesa',qty:1}],
 'Cambio luz LED':[{name:'Luces LED',qty:2}]
};
var ROLE={oficina:{lbl:'Oficina',accent:'--brand',weak:'--brand-weak',ink:'--brand-ink'},
  merch:{lbl:'Mi ruta',accent:'--teal',weak:'--teal-weak',ink:'--teal-ink'},
  almacen:{lbl:'Materiales',accent:'--amber',weak:'--amber-weak',ink:'--amber-ink'}};
/* Key Cities de la operación (editable). Lima/Callao = Lima; el resto = No Key. */
var KEY_CITIES=['Arequipa','Trujillo','Chiclayo','Cusco','Piura'];
/* Alcance por perfil de almacén: cada correo de almacén ve SOLO los merch listados (nombre EXACTO como está en la pestaña USERS). */
var ALMACEN_SCOPE={
 'pamela@ttaudit.com':['Ronald Carrera','Jorge de La Cruz','Josue Jaramillo','Sergio Rubattini','Jeanfranco Balcazar','Rodrigo Gutiperrez','José Montes'],
 'jmarinos@ttaudit.com':['Jorge Hurtado','Angel Cruz','Marco Farfán','José Benites','Freyser Carmona','Jose Mariños']
};
var S={session:null,loginErr:'',loginBusy:false,role:'oficina',view:'planning',whView:'merch',merch:'',date:'',
  cityFilter:'todas',whMerch:'',whPeriod:'dia',entPeriod:'dia',
  gPeriod:'dia',gMerch:'',allRows:[],allLoaded:false,allLoading:false,
  rows:[],merchs:[],materials:[],stores:[],chains:CH,loading:true,error:'',modal:null,imp:null,impStores:null};
var SESS_KEY='rutamerch_sess';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase()||'?';}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'';var a=s.split('-');var d=new Date(+a[0],+a[1]-1,+a[2]);return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});}
function stCls(e){e=norm(e);return e.indexOf('complet')>=0?'3':e.indexOf('camino')>=0?'2':'1';}
function whCls(w){w=norm(w);return w.indexOf('entreg')>=0?'2':w.indexOf('prepar')>=0&&w.indexOf('por')<0?'1':'0';}
function chBadge(c){return '<span class="chain '+(CH.indexOf(c)>=0?c:'')+'">'+esc(c||'PDV')+'</span>';}
function metaChips(t){return (t.tipo?'<span class="chain" style="background:var(--brand-weak);color:var(--brand-ink)">'+esc(t.tipo)+'</span>':'')+(t.activo?'<span class="chain">'+esc(t.activo)+'</span>':'');}
function parseMats(str){if(!str)return[];return String(str).split(/[;\n]+/).map(function(s){return s.trim();}).filter(Boolean).map(function(p){var m=p.match(/^(.*?)\s*[x×]\s*(\d+)\s*$/i);return m?{name:m[1].trim(),qty:parseInt(m[2])||1}:{name:p,qty:1};});}
function serMats(a){return (a||[]).map(function(m){return m.name+' x'+m.qty;}).join('; ');}
function storeLabel(s){return s.pos+(s.id?' · '+s.id:'')+(s.ciudad?' · '+s.ciudad:'');}
function matChips(str){var ms=parseMats(str);if(!ms.length)return '<div class="mat-list"><span style="font-size:12.5px;color:var(--faint)">Sin materiales</span></div>';return '<div class="mat-list">'+ms.map(function(m){return '<span class="mat"><b>'+esc(m.qty)+'</b> '+esc(m.name)+'</span>';}).join('')+'</div>';}
function routeSort(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');}
function storeByTask(t){if(!t||!t.pdv)return null;return S.stores.filter(function(x){return norm(x.pos)===norm(t.pdv)||(t.pdv&&x.id&&norm(x.id)===norm(t.pdv));})[0]||null;}
function taskCity(t){if(t&&t.ciudad)return t.ciudad;var s=storeByTask(t);return s?s.ciudad:'';}
function taskModelo(t){if(t&&t.modelo)return t.modelo;var s=storeByTask(t);return s?s.modelo:'';}
function taskDisp(t){if(t&&t.dispenser)return t.dispenser;var s=storeByTask(t);return s?s.dispenser:'';}
function cityGroup(c){c=norm(c);if(!c)return 'nokey';if(c.indexOf('lima')>=0||c.indexOf('callao')>=0)return 'lima';for(var i=0;i<KEY_CITIES.length;i++){if(c.indexOf(norm(KEY_CITIES[i]))>=0)return 'key';}return 'nokey';}
function applyCity(list){if(S.cityFilter==='todas')return list;return list.filter(function(t){return cityGroup(taskCity(t))===S.cityFilter;});}
/* ---- Alcance de almacén (Pamela / Jose Mariños) ---- */
function almScope(){if(S.role!=='almacen'||!S.session)return null;var sc=ALMACEN_SCOPE[String(S.session.email||'').toLowerCase()];return sc?sc.map(norm):null;}
function scopedMerchs(){var sc=almScope();return sc?S.merchs.filter(function(n){return sc.indexOf(norm(n))>=0;}):S.merchs;}
function inScope(t){var sc=almScope();return sc?sc.indexOf(norm(t.merch))>=0:true;}
/* ---- Periodos / calendario ---- */
function daysList(a,b){var out=[],p=a.split('-'),q=b.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]),e=new Date(+q[0],+q[1]-1,+q[2]);var guard=0;while(d<=e&&guard++<400){out.push(fmtISO(d));d.setDate(d.getDate()+1);}return out;}
function dow2(iso){var a=iso.split('-');var d=new Date(+a[0],+a[1]-1,+a[2]);return ['Do','Lu','Ma','Mi','Ju','Vi','Sá'][d.getDay()];}
function rangeFor(period){return period==='semana'?weekRange(S.date):period==='mes'?monthRange(S.date):[S.date,S.date];}
function periodToggle(cur,action,opts){return '<div class="seg">'+opts.map(function(o){return '<button class="'+(cur===o[0]?'on':'')+'" data-a="'+action+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';}
function merchPick(val,action,list){var opts='<option value=""'+(val?'':' selected')+'>Todos los merch</option>'+list.map(function(n){return '<option'+(norm(val)===norm(n)?' selected':'')+'>'+esc(n)+'</option>';}).join('');return '<span class="pick"><label>Merch</label><select data-a="'+action+'">'+opts+'</select></span>';}
function hm(h){if(!h)return null;var m=String(h).match(/^(\d{1,2}):(\d{2})/);if(!m)return null;return (+m[1])*60+(+m[2]);}
function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekRange(ds){var a=ds.split('-');var d=new Date(+a[0],+a[1]-1,+a[2]);var dow=(d.getDay()+6)%7;var mon=new Date(d);mon.setDate(d.getDate()-dow);var sun=new Date(mon);sun.setDate(mon.getDate()+6);return [fmtISO(mon),fmtISO(sun)];}
function monthRange(ds){var a=ds.split('-');var last=new Date(+a[0],+a[1],0);return [a[0]+'-'+a[1]+'-01',fmtISO(last)];}
function toast(m){var t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;requestAnimationFrame(function(){t.classList.add('show');});clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2400);}

/* ---------- API ---------- */
function apiGet(){return fetch(API+'?date='+encodeURIComponent(S.date)+'&_cb='+Date.now()).then(function(r){return r.text();}).then(function(t){return JSON.parse(t);});}
function apiPost(payload){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.text();}).then(function(t){try{return JSON.parse(t);}catch(e){return{ok:false,error:'resp'};}});}
function load(){
  S.loading=true;S.error='';render();
  apiGet().then(function(d){
    if(!d||!d.ok){S.error=(d&&d.error)||'sin datos';S.loading=false;return render();}
    if(!S.date)S.date=d.today;
    S.rows=d.rows||[];S.merchs=d.merchs||[];S.materials=d.materials||[];S.stores=d.stores||[];S.chains=d.chains||CH;
    if(!S.merch&&S.merchs.length)S.merch=S.merchs[0];
    S.loading=false;render();
  }).catch(function(e){S.error='conexion';S.loading=false;render();});
}
function mutate(payload,msg){
  apiPost(payload).then(function(d){
    if(d&&d.ok){if(msg)toast(msg);S.allLoaded=false;load();}
    else toast('No se pudo guardar'+(d&&d.error?': '+d.error:''));
  }).catch(function(){toast('Error de conexión');});
}

  accent();
  if(!S.session){ app.innerHTML=loginScreen(); var lf=q('[data-a="login"]'); if(lf)lf.addEventListener('submit',doLoginSubmit); return; }
  app.innerHTML='<div class="wrap">'+topbar()+subbar()+'<div class="body" id="body">'+bodyHtml()+'</div></div>'+(S.modal?modalHtml():'');

function doLoginSubmit(e){
  e.preventDefault(); var f=e.target; var email=f.email.value.trim(); var password=f.password.value;
  S.loginBusy=true; S.loginErr=''; render();
  apiPost({action:'login',email:email,password:password}).then(function(d){
    S.loginBusy=false;
    if(d&&d.ok&&d.user){ S.session=d.user; S.role=d.user.rol; if(d.user.rol==='merch')S.merch=d.user.nombre;
      if(S.role==='almacen')S.view='planning'; if(S.role==='oficina')S.view='planning';
      try{localStorage.setItem(SESS_KEY,JSON.stringify(d.user));}catch(e){} load(); }
    else { S.loginErr=(d&&d.error)||'No se pudo iniciar sesión. ¿Backend actualizado?'; render(); }
  }).catch(function(){ S.loginBusy=false; S.loginErr='Error de conexión'; render(); });
}
function logout(){ S.session=null; S.role='oficina'; S.merch=''; try{localStorage.removeItem(SESS_KEY);}catch(e){} render(); }

function bodyHtml(){
  if(S.loading)return '<div class="loading"><div class="spin"></div>Cargando…</div>';
  if(S.error==='conexion')return empty('🔌','Sin conexión con el servidor','No se pudo contactar el backend. Revisa que el Apps Script esté desplegado (acceso: "Cualquier persona") y que la URL en <code>api/exec.js</code> sea correcta.');
  if(S.error)return empty('⚠️','Backend desactualizado','El Apps Script respondió algo inesperado ('+esc(S.error)+'). Pega el nuevo <code>Codigo.gs</code> y haz <b>Nueva versión</b> del despliegue.');
  if(S.role==='merch')return viewMerch();
  if(S.role==='almacen')return viewAlmacen();

/* ---------- OFICINA: GANTT (cronograma día / semana / mes) ---------- */
function viewGantt(){
  if(!S.allLoaded){loadAll();return '<div class="loading"><div class="spin"></div>Cargando cronograma…</div>';}
  var period=S.gPeriod||'dia';
  var rng=rangeFor(period);
  var list=(S.allRows||[]).filter(function(t){return t.fecha>=rng[0]&&t.fecha<=rng[1];});
  list=applyCity(list);
  if(S.gMerch)list=list.filter(function(t){return norm(t.merch)===norm(S.gMerch);});
  var controls='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">'+
    periodToggle(period,'gper',[['dia','Día'],['semana','Semana'],['mes','Mes']])+merchPick(S.gMerch,'gmerch',S.merchs)+'</div>';
  var lbl=period==='dia'?fmtDate(S.date):period==='semana'?('Semana '+rng[0]+' → '+rng[1]):('Mes '+rng[0].slice(0,7));
  var head='<div class="sech">Cronograma · '+lbl+'</div>';
  if(!list.length)return controls+head+empty('📅','Sin OTs','No hay tareas planificadas'+(S.cityFilter!=='todas'||S.gMerch?' para este filtro':'')+' en este periodo.');
  var done=list.filter(function(t){return stCls(t.estado)==='3';}).length;
  var stats='<div class="stat-row"><div class="stat accent"><div class="n tnum">'+list.length+'</div><div class="l">OTs</div></div>'+
    '<div class="stat"><div class="n tnum">'+new Set(list.map(function(t){return t.merch;})).size+'</div><div class="l">Merch</div></div>'+
    '<div class="stat"><div class="n tnum">'+done+'/'+list.length+'</div><div class="l">Completadas</div></div></div>';
  var body=period==='dia'?ganttDayBody(list):ganttCalBody(list,rng,period);
  return controls+stats+head+body;
}
function ganttDayBody(list){
  var times=list.map(function(t){return hm(t.hora);}).filter(function(x){return x!=null;});
  var start=7*60,end=20*60;
  if(times.length){start=Math.min(start,Math.floor(Math.min.apply(null,times)/60)*60);end=Math.max(end,Math.ceil(Math.max.apply(null,times)/60)*60);}
  var span=Math.max(60,end-start);
  var ticks='';for(var h=start;h<=end;h+=60){var l=(h-start)/span*100;ticks+='<div style="position:absolute;left:'+l+'%;top:0;bottom:0;border-left:1px solid var(--border)"></div><span style="position:absolute;left:'+l+'%;top:-16px;font-size:10px;color:var(--faint);font-family:var(--fdisp);transform:translateX(2px)">'+String((h/60)|0).padStart(2,'0')+'h</span>';}
  var by={};list.forEach(function(t){(by[t.merch]=by[t.merch]||[]).push(t);});
  var rows=Object.keys(by).sort().map(function(mid){
    var ts=by[mid].sort(routeSort);
    var chips=ts.map(function(t){var m=hm(t.hora);if(m==null)return '';var st=stCls(t.estado);
      var color=st==='3'?'var(--green)':st==='2'?'var(--brand)':'var(--faint)';
      var l=(m-start)/span*100;
      return '<div title="'+esc(t.hora+' · '+t.pdv+(taskCity(t)?' · '+taskCity(t):''))+'" style="position:absolute;left:'+l+'%;top:7px;background:var(--surface-2);border:1px solid var(--border-strong);border-left:3px solid '+color+';border-radius:8px;padding:3px 7px;font-size:11px;font-family:var(--fdisp);font-weight:700;white-space:nowrap;box-shadow:var(--shadow);max-width:150px;overflow:hidden;text-overflow:ellipsis;z-index:2">'+esc(t.hora)+' · '+esc(t.pdv)+'</div>';
    }).join('');
    var noTime=ts.filter(function(t){return hm(t.hora)==null;});
    var noTimeHtml=noTime.length?'<span style="font-size:10.5px;color:var(--amber-ink);font-weight:600"> · '+noTime.length+' sin hora</span>':'';
    return '<div style="display:flex;align-items:stretch;border-top:1px solid var(--border)">'+
      '<div style="width:118px;flex-shrink:0;padding:10px 8px;display:flex;align-items:center;gap:8px;position:sticky;left:0;background:var(--surface);z-index:3;border-right:1px solid var(--border)"><div class="avatar" style="width:28px;height:28px;font-size:12px">'+initials(mid)+'</div><div style="font-family:var(--fdisp);font-weight:700;font-size:12px;line-height:1.15">'+esc(mid)+noTimeHtml+'</div></div>'+
      '<div style="position:relative;flex:1;min-height:50px">'+ticks+chips+'</div></div>';
  }).join('');
  return '<div class="card" style="overflow-x:auto;padding-top:20px"><div style="min-width:700px">'+rows+'</div></div>'+
    '<div class="hint">Barras posicionadas por hora. <b style="color:var(--faint)">Gris</b> = pendiente · <b style="color:var(--brand)">Azul</b> = en camino · <b style="color:var(--green)">Verde</b> = completada. Desliza horizontalmente para ver toda la jornada.</div>';
}
function ganttCalBody(list,rng,period){
  var days=daysList(rng[0],rng[1]);
  var by={};list.forEach(function(t){var m=by[t.merch]||(by[t.merch]={});(m[t.fecha]||(m[t.fecha]=[])).push(t);});
  var merchs=Object.keys(by).sort();
  var colW=period==='mes'?46:120,nameW=120,td=today();
  var hdr='<div style="display:flex">'+
    '<div style="width:'+nameW+'px;flex-shrink:0;position:sticky;left:0;background:var(--surface-2);border-right:1px solid var(--border);border-bottom:1px solid var(--border);z-index:5"></div>'+
    days.map(function(iso){var d=iso.split('-')[2];var isTd=iso===td,isSel=iso===S.date;
      return '<button data-a="gday" data-v="'+iso+'" title="Ver cronograma de este día" style="width:'+colW+'px;flex-shrink:0;border:none;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:'+(isSel?'var(--role-weak)':'var(--surface-2)')+';padding:5px 2px;text-align:center;cursor:pointer">'+
        '<div style="font-size:9.5px;color:var(--faint);font-family:var(--fdisp);text-transform:uppercase;letter-spacing:.03em">'+dow2(iso)+'</div>'+
        '<div style="font-family:var(--fdisp);font-weight:800;font-size:'+(period==='mes'?'12':'14')+'px;color:'+(isTd?'var(--role)':'var(--ink)')+'">'+d+'</div></button>';
    }).join('')+'</div>';
  var body=merchs.map(function(mid){
    var tot=0;days.forEach(function(iso){tot+=(by[mid][iso]||[]).length;});
    var cells=days.map(function(iso){
      var ts=(by[mid][iso]||[]).sort(routeSort);var mh=period==='mes'?'40':'56';
      if(!ts.length)return '<div style="width:'+colW+'px;flex-shrink:0;border-right:1px solid var(--border);border-top:1px solid var(--border);min-height:'+mh+'px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px">·</div>';
      var done=ts.filter(function(t){return stCls(t.estado)==='3';}).length;
      var col=done===ts.length?'var(--green)':ts.some(function(t){return stCls(t.estado)==='2';})?'var(--brand)':'var(--amber)';
      var inner;
      if(period==='mes'){
        inner='<div title="'+esc(ts.length+' OT · '+done+' completadas')+'" style="width:26px;height:26px;border-radius:8px;background:'+col+';color:#fff;font-family:var(--fdisp);font-weight:800;font-size:12px;display:grid;place-items:center">'+ts.length+'</div>';
      }else{
        inner=ts.slice(0,4).map(function(t){var st=stCls(t.estado);var c=st==='3'?'var(--green)':st==='2'?'var(--brand)':'var(--faint)';
          return '<div title="'+esc((t.hora?t.hora+' · ':'')+t.pdv+(taskCity(t)?' · '+taskCity(t):''))+'" style="border-left:3px solid '+c+';background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 5px;font-size:10px;font-family:var(--fdisp);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px">'+esc((t.hora?t.hora+' ':'')+t.pdv)+'</div>';
        }).join('')+(ts.length>4?'<div style="font-size:10px;color:var(--muted);font-weight:700">+'+(ts.length-4)+' más</div>':'');
      }
      return '<div style="width:'+colW+'px;flex-shrink:0;border-right:1px solid var(--border);border-top:1px solid var(--border);min-height:'+mh+'px;padding:4px;display:flex;'+(period==='mes'?'align-items:center;justify-content:center':'flex-direction:column')+'">'+inner+'</div>';
    }).join('');
    return '<div style="display:flex">'+
      '<div style="width:'+nameW+'px;flex-shrink:0;position:sticky;left:0;background:var(--surface);border-right:1px solid var(--border);border-top:1px solid var(--border);z-index:2;padding:8px;display:flex;align-items:center;gap:7px"><div class="avatar" style="width:26px;height:26px;font-size:11px">'+initials(mid)+'</div><div style="min-width:0"><div style="font-family:var(--fdisp);font-weight:700;font-size:11.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(mid)+'</div><div style="font-size:10px;color:var(--muted)">'+tot+' OT</div></div></div>'+
      cells+'</div>';
  }).join('');
  var minW=nameW+days.length*colW;
  return '<div class="card" style="overflow-x:auto"><div style="min-width:'+minW+'px">'+hdr+body+'</div></div>'+
    '<div class="hint">Toca un día del encabezado para abrir su cronograma por hora. '+(period==='mes'?'El número = OTs de ese día · <b style="color:var(--green)">verde</b>=todas completadas, <b style="color:var(--brand)">azul</b>=en curso, <b style="color:var(--amber-ink)">ámbar</b>=pendientes.':'Cada barra es una OT (color por estado). Desliza para ver toda la semana.')+'</div>';
}

/* ---------- OFICINA: IMPORTAR ---------- */
function viewImport(){
  var im=S.imp;
  return '<div class="banner">📥 Arma tu planning en Excel y súbelo. Descarga la plantilla para las columnas exactas. Cada fila = una tarea.</div>'+
    '<div class="card pad"><div class="nm" style="font-size:15px;margin-bottom:3px">Cargar planning desde Excel</div>'+
    '<div style="font-size:12px;color:var(--faint);margin-bottom:12px">Columnas: <b style="color:var(--muted)">fecha, merch, cadena, pdv, direccion, hora, descripcion, materiales</b></div>'+

function onImpStores(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(ev){try{
    var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    var out=[],skip=0;
    rows.forEach(function(r){
      var pick=function(keys){for(var k in r){if(keys.indexOf(norm(k))>=0)return r[k];}return '';};
      var id=String(pick(['id store','idstore','id','codigo','codigo tt audit','cod'])).trim();
      var pos=String(pick(['nombre del pos','pos','nombre','tienda'])).trim();
      if(!id&&!pos){skip++;return;}
      out.push({id:id,canal:String(pick(['canal'])||'').trim(),cadena:String(pick(['cadena'])||'').trim().toUpperCase(),pos:pos,
        direccion:String(pick(['direccion'])||'').trim(),lat:String(pick(['latitud','lat'])||'').trim(),lng:String(pick(['longitud','long','lng'])||'').trim(),
        ciudad:String(pick(['ciudad'])||'').trim(),departamento:String(pick(['departamento','depto'])||'').trim(),
        modelo:String(pick(['modelo de cigarrera','modelo','cigarrera'])||'').trim(),cantidad:String(pick(['cantidad','cant'])||'').trim(),dispenser:String(pick(['dispenser'])||'').trim()});
    });
    if(!out.length)S.impStores={error:'No se encontraron tiendas. Revisa las columnas contra la plantilla.'};
    else S.impStores={rows:out,skipped:skip};
    render();
  }catch(err){S.impStores={error:'No se pudo leer el archivo.'};render();}};
  rd.readAsArrayBuffer(file);e.target.value='';
}
function doImportStores(){var im=S.impStores;if(!im||!im.rows)return;var rows=im.rows;S.impStores=null;mutate({action:'setStores',stores:rows},rows.length+' tiendas cargadas');}

/* ---------- ALMACEN (Pamela) ---------- */
function loadAll(){
  if(S.allLoading)return;S.allLoading=true;
  fetch(API+'?all=1&_cb='+Date.now()).then(function(r){return r.text();}).then(function(t){
    var d=JSON.parse(t);S.allRows=(d&&d.rows)||[];S.allLoaded=true;S.allLoading=false;render();
  }).catch(function(){S.allLoaded=true;S.allLoading=false;S.allRows=[];render();});
}
function merchFilterCtl(){return '<div style="margin-bottom:12px">'+merchPick(S.whMerch,'whmerch',scopedMerchs())+'</div>';}
function viewAlmacen(){
  var seg='<div class="seg" style="margin-bottom:12px">'+
    [['merch','Por merch'],['consolidado','Consolidado'],['entregas','Entregas']].map(function(o){return '<button class="'+(S.whView===o[0]?'on':'')+'" data-a="whtab" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  if(S.whView==='entregas'){
    if(!S.allLoaded){loadAll();return seg+'<div class="loading"><div class="spin"></div>Cargando entregas…</div>';}
    return seg+viewEntregas();
  }
  var period=S.whPeriod||'dia';
  var pt=periodToggle(period,'whper',[['dia','Día'],['semana','Semana'],['mes','Mes']]);
  if(period!=='dia'&&!S.allLoaded){loadAll();return seg+'<div style="margin-bottom:12px">'+pt+'</div><div class="loading"><div class="spin"></div>Cargando…</div>';}
  var rng=rangeFor(period);
  var src=period==='dia'?rowsDate():(S.allRows||[]).filter(function(t){return t.fecha>=rng[0]&&t.fecha<=rng[1];});
  var list=src.filter(function(t){return t.materiales;}).filter(inScope);
  if(S.whMerch)list=list.filter(function(t){return norm(t.merch)===norm(S.whMerch);});
  var controls='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+pt+merchPick(S.whMerch,'whmerch',scopedMerchs())+'</div>';
  var lbl=period==='dia'?fmtDate(S.date):period==='semana'?('Semana '+rng[0]+' → '+rng[1]):('Mes '+rng[0].slice(0,7));
  if(!list.length)return seg+controls+empty('📦','Nada que preparar','No hay materiales solicitados'+(S.whMerch?' para '+esc(S.whMerch):'')+' en '+lbl+'.');
  var units=0;list.forEach(function(t){parseMats(t.materiales).forEach(function(m){units+=m.qty;});});
  var stats='<div class="stat-row"><div class="stat accent"><div class="n tnum">'+units+'</div><div class="l">Unidades</div></div>'+
    '<div class="stat"><div class="n tnum">'+new Set(list.map(function(t){return t.merch;})).size+'</div><div class="l">Merch</div></div>'+
    '<div class="stat"><div class="n tnum">'+list.filter(function(t){return whCls(t.almacen)==='2';}).length+'/'+list.length+'</div><div class="l">Entregados</div></div></div>';
  return stats+seg+controls+'<div class="sech">'+lbl+'</div>'+(S.whView==='consolidado'?whCons(list):whByMerch(list));
}
function whCons(list){
  var agg={};list.forEach(function(t){parseMats(t.materiales).forEach(function(m){agg[m.name]=(agg[m.name]||0)+m.qty;});});
  var rows=Object.keys(agg).map(function(k){return{name:k,qty:agg[k]};}).sort(function(a,b){return b.qty-a.qty;});
  return '<div class="sech">Total a picar · '+fmtDate(S.date)+'</div><div class="card">'+rows.map(function(m){return '<div class="list-row"><div class="qbox tnum">'+m.qty+'</div><div style="flex:1"><div class="nm">'+esc(m.name)+'</div></div></div>';}).join('')+'</div>';
}
function whByMerch(list){
  var by={};list.forEach(function(t){(by[t.merch]=by[t.merch]||[]).push(t);});
  return Object.keys(by).sort().map(function(mid){
    var ts=by[mid].sort(routeSort);var u=0;ts.forEach(function(t){parseMats(t.materiales).forEach(function(m){u+=m.qty;});});
    var head='<div class="group-head"><div class="avatar">'+initials(mid)+'</div><div><div class="nm">'+esc(mid)+'</div><div class="meta">'+u+' unidades · '+ts.length+' tiendas</div></div><span class="count-pill">'+u+'</span></div>';
    var cards=ts.map(function(t){var w=whCls(t.almacen);
      var meta=(t.tipo||t.activo)?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">'+metaChips(t)+'</div>':'';
      var com=t.descripcion?'<div class="desc" style="margin-top:6px">💬 '+esc(t.descripcion)+'</div>':'';
      return '<div class="task card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">'+chBadge(t.cadena)+'<span class="pdv" style="font-size:14px">'+esc(t.pdv)+'</span><span class="badge wh'+w+'" style="margin-left:auto">'+esc(t.almacen)+'</span></div>'+
        meta+assetInfo(t)+com+matChips(t.materiales)+
        '<div class="t-actions">'+
        (w==='0'?'<button class="btn primary sm" data-a="prep" data-r="'+t.row+'">📦 Preparar</button>':'')+
        (w==='1'?'<button class="btn primary sm" data-a="wst" data-r="'+t.row+'" data-v="Entregado">✅ Entregado</button>':'')+
        (w!=='0'?'<button class="btn ghost sm" data-a="wst" data-r="'+t.row+'" data-v="Por preparar">↺ Reabrir</button>':'')+'</div></div>';
    }).join('');
    return '<div class="group">'+head+cards+'</div>';
  }).join('');
}
/* ---------- ALMACEN: ENTREGAS (control por día / semana / mes) ---------- */
function viewEntregas(){
  var period=S.entPeriod||'dia';
  var isTodo=period==='todo';
  var rng=rangeFor(period==='todo'?'dia':period);
  var toggle='<div class="seg" style="margin-bottom:12px">'+[['dia','Día'],['semana','Semana'],['mes','Mes'],['todo','Todo']].map(function(o){return '<button class="'+(period===o[0]?'on':'')+'" data-a="entper" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  var rangeLbl='<div class="sech">'+(isTodo?'Entregado · histórico (todo)':period==='dia'?'Entregado · '+fmtDate(S.date):period==='semana'?'Semana '+rng[0]+' → '+rng[1]:'Mes '+rng[0].slice(0,7))+'</div>';
  var rows=(S.allRows||[]).filter(function(t){return whCls(t.almacen)==='2'&&t.materiales;});
  if(!isTodo)rows=rows.filter(function(t){return t.fecha>=rng[0]&&t.fecha<=rng[1];});
  rows=rows.filter(inScope);
  if(S.whMerch)rows=rows.filter(function(t){return norm(t.merch)===norm(S.whMerch);});
  var filter='<div style="margin-bottom:12px">'+merchPick(S.whMerch,'whmerch',scopedMerchs())+'</div>';
  if(!rows.length)return toggle+filter+rangeLbl+empty('📦','Sin entregas','No hay materiales marcados como <b>Entregado</b>'+(isTodo?'':' en este periodo')+'. Marca las tarjetas como <b>✅ Entregado</b> en la pestaña <b>Por merch</b> y aparecerán aquí consolidadas.');
  var units=0,byMerch={},agg={};
  rows.forEach(function(t){parseMats(t.materiales).forEach(function(m){
    units+=m.qty;agg[m.name]=(agg[m.name]||0)+m.qty;
    var b=byMerch[t.merch]=byMerch[t.merch]||{u:0,mats:{},stores:{}};
    b.u+=m.qty;b.mats[m.name]=(b.mats[m.name]||0)+m.qty;b.stores[t.row]=1;
  });});
  var stats='<div class="stat-row"><div class="stat accent"><div class="n tnum">'+units+'</div><div class="l">Unid. entregadas</div></div>'+
    '<div class="stat"><div class="n tnum">'+Object.keys(byMerch).length+'</div><div class="l">Merch</div></div>'+
    '<div class="stat"><div class="n tnum">'+rows.length+'</div><div class="l">Tiendas</div></div></div>';
  var per=Object.keys(byMerch).sort().map(function(mid){var b=byMerch[mid];
    var mats=Object.keys(b.mats).sort(function(a,c){return b.mats[c]-b.mats[a];}).map(function(n){return '<span class="mat"><b>'+b.mats[n]+'</b> '+esc(n)+'</span>';}).join('');
    return '<div class="group"><div class="group-head"><div class="avatar">'+initials(mid)+'</div><div><div class="nm">'+esc(mid)+'</div><div class="meta">'+b.u+' unidades · '+Object.keys(b.stores).length+' tiendas</div></div><span class="count-pill">'+b.u+'</span></div><div class="card pad"><div class="mat-list">'+mats+'</div></div></div>';
  }).join('');
  var cons=Object.keys(agg).sort(function(a,c){return agg[c]-agg[a];}).map(function(n){return '<div class="list-row"><div class="qbox tnum">'+agg[n]+'</div><div style="flex:1"><div class="nm">'+esc(n)+'</div></div></div>';}).join('');
  return toggle+filter+stats+rangeLbl+per+'<div class="sech" style="margin-top:6px">Total por material</div><div class="card">'+cons+'</div>';
}

  return '<div class="overlay" data-a="ov"><div class="sheet" data-stop>'+head(m.row?'Editar tarea':'Nueva tarea')+'<form data-a="savetask">'+storeField+
    '<div class="row2"><div class="field"><label>Merch</label><select name="merch" required><option value="">Elegir…</option>'+merchOpts+'</select></div>'+
    '<div class="field"><label>Hora</label><input name="hora" type="time" value="'+esc(d.hora||'')+'"></div></div>'+
    '<div class="row2"><div class="field"><label>Cadena</label><select name="cadena">'+chOpts+'</select></div>'+
    '<div class="field"><label>Tienda / PDV</label><input name="pdv" value="'+esc(d.pdv||'')+'" placeholder="Tambo Av. Larco" required></div></div>'+
    '<div class="field"><label>Dirección</label><input name="direccion" value="'+esc(d.direccion||'')+'" placeholder="Av. Larco 123, Miraflores"></div>'+
    '<div class="field"><label>Ciudad</label><input name="ciudad" value="'+esc(d.ciudad||'')+'" placeholder="Lima, Arequipa, Trujillo…"></div>'+
    '<div class="row2"><div class="field"><label>Modelo de cigarrera</label><input name="modelo" value="'+esc(d.modelo||'')+'" placeholder="Del punto (base)"></div>'+
    '<div class="field"><label>Dispenser</label><input name="dispenser" value="'+esc(d.dispenser||'')+'" placeholder="Del punto (base)"></div></div>'+
    '<div class="row2"><div class="field"><label>Activo</label><select name="activo"><option value="">—</option>'+activoOpts+'</select></div>'+
    '<div class="field"><label>Tipo de tarea</label><select name="tipo" id="tipoSel"><option value="">—</option>'+tipoOpts+'</select></div></div>'+
    '<div class="field"><label>Descripción / detalle</label><textarea name="descripcion" placeholder="Detalle (obligatorio si el tipo es Otros)">'+esc(d.descripcion||'')+'</textarea></div>'+
    matEditorHtml(d)+
    '<div style="height:16px"></div><button class="btn primary block" type="submit">'+(m.row?'Guardar cambios':'Crear tarea')+'</button></form></div></div>';
}
function modalPrep(m){
  var d=m.draft;
  return '<div class="overlay" data-a="ov"><div class="sheet" data-stop>'+head('Preparar materiales')+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">'+chBadge(m.cadena)+'<span class="pdv" style="font-size:15px">'+esc(m.pdv)+'</span></div>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Merch: <b style="color:var(--ink-soft)">'+esc(m.merch)+'</b>'+(m.modelo?' · Cigarrera: <b style="color:var(--ink-soft)">'+esc(m.modelo)+'</b>':'')+(m.dispenser&&norm(m.dispenser)!=='no'?' · Dispenser: <b style="color:var(--ink-soft)">'+esc(m.dispenser)+'</b>':'')+'</div>'+
    (m.descripcion?'<div class="desc" style="margin-bottom:14px">💬 '+esc(m.descripcion)+'</div>':'')+
    '<div class="hint" style="margin-top:0;margin-bottom:14px">Si el merch necesita algo extra, agrégalo aquí antes de marcar preparado.</div>'+
    matEditorHtml(d)+
    '<form data-a="saveprep"><div style="height:16px"></div><button class="btn primary block" type="submit">📦 Marcar preparado</button></form></div></div>';
}
function modalSimple(title,type,fields){
  var f=fields.map(function(x){return '<div class="field"><label>'+x.l+'</label><input name="'+x.k+'" placeholder="'+x.ph+'"'+(x.k==='nombre'||x.k==='name'?' required':'')+'></div>';}).join('');
  return '<div class="overlay" data-a="ov"><div class="sheet" data-stop>'+head(title)+'<form data-a="save'+type+'">'+f+'<button class="btn primary block" type="submit">Guardar</button></form></div></div>';
}

/* ---------- WIRE ---------- */
function wire(){
  var f;
  f=q('[data-a="savetask"]');if(f)f.addEventListener('submit',onSaveTask);
  f=q('[data-a="saveprep"]');if(f)f.addEventListener('submit',onSavePrep);
  var wm=q('[data-a="whmerch"]');if(wm)wm.addEventListener('change',function(e){S.whMerch=e.target.value;render();});
  var gmc=q('[data-a="gmerch"]');if(gmc)gmc.addEventListener('change',function(e){S.gMerch=e.target.value;render();});
  f=q('[data-a="savemerch"]');if(f)f.addEventListener('submit',function(e){e.preventDefault();var v=e.target.nombre.value.trim();if(v)mutate({action:'addMerch',nombre:v},'Merch agregado');closeM();});
  f=q('[data-a="savemat"]');if(f)f.addEventListener('submit',function(e){e.preventDefault();var n=e.target.name.value.trim();if(n)mutate({action:'addMaterial',name:n,unit:e.target.unit.value.trim(),qty:Number(e.target.qty.value)||1},'Material agregado');closeM();});
  var im=q('[data-a="impfile"]');if(im)im.addEventListener('change',onImp);
  var ist=q('[data-a="impStores"]');if(ist)ist.addEventListener('change',onImpStores);
  var si=q('#storeInput');if(si)si.addEventListener('change',onStorePick);
  var tp=q('#tipoSel');if(tp)tp.addEventListener('change',onTipoChange);
  var msel=q('#matSel');if(msel)msel.addEventListener('change',onMatSel);
  qa('[data-a="date"]').forEach(function(i){i.addEventListener('change',function(e){S.date=e.target.value;load();});});
  var ms=q('[data-a="merchsel"]');if(ms)ms.addEventListener('change',function(e){S.merch=e.target.value;render();});
  app.onclick=click;
  var ov=q('.overlay');if(ov)ov.addEventListener('click',click);
}
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function click(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
  if(a==='ov'){if(!e.target.closest('[data-stop]'))closeM();return;}
  if(a==='reload'){load();}
  else if(a==='logout'){logout();}
  else if(a==='role'){S.role=t.dataset.v;render();}
  else if(a==='ofctab'){S.view=t.dataset.v;S.imp=null;S.impStores=null;render();}
  else if(a==='city'){S.cityFilter=t.dataset.v;render();}
  else if(a==='entper'){S.entPeriod=t.dataset.v;render();}
  else if(a==='gper'){S.gPeriod=t.dataset.v;render();}
  else if(a==='whper'){S.whPeriod=t.dataset.v;render();}
  else if(a==='gday'){S.date=t.dataset.v;S.gPeriod='dia';render();}
  else if(a==='prep'){var rp=findRow(t.dataset.r);S.modal={type:'prep',row:+t.dataset.r,pdv:rp.pdv,merch:rp.merch,cadena:rp.cadena,modelo:taskModelo(rp),dispenser:taskDisp(rp),descripcion:rp.descripcion,draft:{mats:parseMats(rp.materiales)}};render();}
  else if(a==='tplStores'){downloadTplStores();}
  else if(a==='impStoresOk'){doImportStores();}
  else if(a==='impStoresCancel'){S.impStores=null;render();}
  else if(a==='whtab'){S.whView=t.dataset.v;render();}
  else if(a==='newtask'){S.modal={type:'task',row:null,draft:{cadena:'TAMBO',mats:[]}};render();}
  else if(a==='edit'){var r=findRow(t.dataset.r);S.modal={type:'task',row:+t.dataset.r,draft:{merch:r.merch,cadena:r.cadena,pdv:r.pdv,direccion:r.direccion,hora:r.hora,descripcion:r.descripcion,activo:r.activo,tipo:r.tipo,ciudad:r.ciudad,modelo:r.modelo,dispenser:r.dispenser,mats:parseMats(r.materiales)}};render();}
  else if(a==='del'){if(confirm('¿Eliminar esta tarea?'))mutate({action:'delete',row:+t.dataset.r},'Tarea eliminada');}
  else if(a==='mst'){mutate({action:'update',row:+t.dataset.r,estado:t.dataset.v},'Estado actualizado');}
  else if(a==='wst'){mutate({action:'update',row:+t.dataset.r,almacen:t.dataset.v},'Almacén actualizado');}
  else if(a==='newmerch'){S.modal={type:'merch'};render();}
  else if(a==='newmat'){S.modal={type:'mat'};render();}
  else if(a==='closem'){closeM();}
  else if(a==='addmat'){addDraftMat();}
  else if(a==='rmmat'){S.modal.draft.mats.splice(+t.dataset.i,1);render();}
  else if(a==='tpl'){downloadTpl();}
  else if(a==='impok'){doImport();}
  else if(a==='impcancel'){S.imp=null;render();}
}
function findRow(r){return S.rows.filter(function(x){return x.row===+r;})[0]||{};}
function closeM(){S.modal=null;render();}
function captureTask(){var f=q('[data-a="savetask"]');if(!f)return;var d=S.modal.draft;d.merch=f.merch.value;d.hora=f.hora.value;d.cadena=f.cadena.value;d.pdv=f.pdv.value;d.direccion=f.direccion.value;d.descripcion=f.descripcion.value;if(f.activo)d.activo=f.activo.value;if(f.tipo)d.tipo=f.tipo.value;if(f.ciudad)d.ciudad=f.ciudad.value;if(f.modelo)d.modelo=f.modelo.value;if(f.dispenser)d.dispenser=f.dispenser.value;}
function onSavePrep(e){e.preventDefault();var m=S.modal;var mats=serMats(m.draft.mats);var row=m.row;closeM();mutate({action:'update',row:row,materiales:mats,almacen:'Preparado'},'Preparado');}
function onTipoChange(e){var tipo=e.target.value;captureTask();var d=S.modal.draft;d.tipo=tipo;var sug=TIPO_MATS[tipo];if(sug)d.mats=sug.map(function(m){return {name:m.name,qty:m.qty};});render();}
function onMatSel(e){var m=S.materials.filter(function(x){return x.name===e.target.value;})[0];var qi=document.getElementById('matQty');if(m&&qi)qi.value=m.qty||1;}
function onStorePick(e){
  var val=e.target.value;var s=S.stores.filter(function(x){return storeLabel(x)===val;})[0];if(!s)return;
  captureTask();var d=S.modal.draft;
  d.pdv=s.pos||d.pdv; d.direccion=s.direccion||d.direccion;
  d.ciudad=s.ciudad||d.ciudad; d.modelo=s.modelo||d.modelo; d.dispenser=s.dispenser||d.dispenser;
  if(s.cadena&&CH.indexOf(String(s.cadena).toUpperCase())>=0)d.cadena=String(s.cadena).toUpperCase();
  render();
}
function addDraftMat(){var sel=document.getElementById('matSel'),qi=document.getElementById('matQty');if(!sel||!sel.value)return;captureTask();var nm=sel.value,qty=Math.max(1,parseInt(qi.value)||1);S.modal.draft.mats=S.modal.draft.mats||[];var ex=S.modal.draft.mats.filter(function(m){return m.name===nm;})[0];if(ex)ex.qty+=qty;else S.modal.draft.mats.push({name:nm,qty:qty});render();}
function onSaveTask(e){
  e.preventDefault();var f=e.target;if(!f.merch.value){toast('Elige un merch');return;}
  var payload={fecha:S.date,merch:f.merch.value,cadena:f.cadena.value,pdv:f.pdv.value.trim(),direccion:f.direccion.value.trim(),
    hora:f.hora.value,descripcion:f.descripcion.value.trim(),activo:f.activo.value,tipo:f.tipo.value,
    ciudad:f.ciudad.value.trim(),modelo:f.modelo.value.trim(),dispenser:f.dispenser.value.trim(),materiales:serMats(S.modal.draft.mats)};
  var isEdit=!!S.modal.row;
  if(isEdit){payload.action='update';payload.row=S.modal.row;}else{payload.action='create';}
  closeM();mutate(payload,isEdit?'Tarea guardada':'Tarea creada');
}

/* ---------- IMPORT ---------- */
function onImp(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(ev){try{
    var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    var out=[],skip=0;
    rows.forEach(function(r){
      var pick=function(keys){for(var k in r){if(keys.indexOf(norm(k))>=0)return r[k];}return '';};
      var pdv=pick(['pdv','tienda','nombre']),merch=pick(['merch','usuario']);
      if(!pdv||!merch){skip++;return;}
      var raw=pick(['fecha','date']),date='';
      if(raw instanceof Date)date=raw.getFullYear()+'-'+String(raw.getMonth()+1).padStart(2,'0')+'-'+String(raw.getDate()).padStart(2,'0');
      else{date=String(raw||'').trim();var mm=date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(mm)date=mm[3]+'-'+String(mm[2]).padStart(2,'0')+'-'+String(mm[1]).padStart(2,'0');}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date))date=S.date;
      var ho=pick(['hora','time']);if(ho instanceof Date)ho=String(ho.getHours()).padStart(2,'0')+':'+String(ho.getMinutes()).padStart(2,'0');
      out.push({fecha:date,merch:String(merch).trim(),cadena:String(pick(['cadena','chain'])||'Otro').trim().toUpperCase(),pdv:String(pdv).trim(),
        direccion:String(pick(['direccion','address'])||'').trim(),hora:String(ho||'').trim(),descripcion:String(pick(['descripcion','tarea'])||'').trim(),
        materiales:String(pick(['materiales','material'])||'').trim(),estado:'Pendiente',almacen:'Por preparar'});
    });
    if(!out.length)S.imp={error:'No se encontraron filas válidas. Revisa las columnas contra la plantilla.'};
    else S.imp={rows:out,skipped:skip};
    render();
  }catch(err){S.imp={error:'No se pudo leer el archivo.'};render();}};
  rd.readAsArrayBuffer(file);e.target.value='';
}
function doImport(){var im=S.imp;if(!im||!im.rows)return;var rows=im.rows;S.imp=null;mutate({action:'bulk',rows:rows},rows.length+' tarea(s) cargadas');}
function downloadTpl(){
  var ws=XLSX.utils.aoa_to_sheet([['fecha','merch','cadena','pdv','direccion','hora','descripcion','materiales'],
    [S.date,(S.merchs[0]||'Ana Torres'),'TAMBO','Tambo Av. Larco','Av. Larco 123','09:30','Instalar dispenser','Transformador eléctrico x1; Afiche A3 x4']]);
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Plantilla');
  XLSX.writeFile(wb,'plantilla_planning.xlsx');
}

(function boot(){
  try{var ss=JSON.parse(localStorage.getItem(SESS_KEY)||'null'); if(ss&&ss.email){S.session=ss;S.role=ss.rol;if(ss.rol==='merch')S.merch=ss.nombre;}}catch(e){}
  S.date=today();
  if(S.session) load(); else render();
})();
</script>
