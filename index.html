<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RutaMerch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ground:#eef0f4;--surface:#fff;--surface-2:#f7f8fb;--surface-3:#eef1f6;
    --ink:#161922;--ink-soft:#39414f;--muted:#69738a;--faint:#97a0b3;
    --border:#e2e6ee;--border-strong:#d2d8e4;
    --brand:#2f56d9;--brand-weak:#e7edfc;--brand-ink:#1e3fae;
    --teal:#0f9d8f;--teal-weak:#dcf5f1;--teal-ink:#0a6f65;
    --amber:#dd8709;--amber-weak:#fbeecf;--amber-ink:#9c5f05;
    --green:#12a150;--green-weak:#d9f6e4;--green-ink:#0a7a3b;
    --role:var(--brand);--role-weak:var(--brand-weak);--role-ink:var(--brand-ink);
    --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.05);
    --r:14px;--r-sm:10px;--fdisp:'Archivo',system-ui,sans-serif;--fbody:'Manrope',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0e1016;--surface:#171b24;--surface-2:#1e232e;--surface-3:#252b38;
    --ink:#f1f3f8;--ink-soft:#cdd3df;--muted:#98a1b3;--faint:#6b7488;
    --border:#2a303c;--border-strong:#39414f;
    --brand:#6f8dff;--brand-weak:#1e2740;--brand-ink:#adbeff;
    --teal:#3ec8b8;--teal-weak:#123030;--teal-ink:#6fe0d2;
    --amber:#f0a839;--amber-weak:#33280f;--amber-ink:#f6c775;
    --green:#3ec07a;--green-weak:#12301f;--green-ink:#74dd9f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--fbody);-webkit-font-smoothing:antialiased;line-height:1.45}
  h1,h2,h3{font-family:var(--fdisp);margin:0;line-height:1.15;letter-spacing:-.01em}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;background:var(--role);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(20,25,40,.16)}
  .brand{font-family:var(--fdisp);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:#fff;opacity:.9}
  .brand small{display:block;font-size:10.5px;font-weight:600;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
  .refresh{margin-left:auto;background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer}
  .refresh:active{background:rgba(255,255,255,.3)}
  .subbar{position:sticky;top:62px;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:8px;font-family:var(--fdisp);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .pick{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 8px}
  .pick label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-family:var(--fdisp)}
  .pick select,.pick input{border:none;background:transparent;color:var(--ink);font-weight:600;font-size:13.5px;outline:none;font-family:var(--fbody);max-width:150px}
  .body{padding:16px 16px 48px}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--fdisp);font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:6px}
  .stat.accent .n{color:var(--role)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .group{margin-bottom:20px}
  .group-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
  .avatar{width:34px;height:34px;border-radius:10px;background:var(--role-weak);color:var(--role-ink);font-family:var(--fdisp);font-weight:800;font-size:14px;display:grid;place-items:center;flex-shrink:0}
  .group-head .nm{font-family:var(--fdisp);font-weight:700;font-size:15.5px}
  .group-head .meta{font-size:12px;color:var(--muted)}
  .count-pill{margin-left:auto;background:var(--surface-3);color:var(--ink-soft);font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;font-family:var(--fdisp)}
  .task{padding:14px;border-radius:var(--r);margin-bottom:10px;border-left:3px solid var(--border-strong)}
  .task.s1{border-left-color:var(--faint)}.task.s2{border-left-color:var(--brand)}.task.s3{border-left-color:var(--green)}
  .t-top{display:flex;align-items:flex-start;gap:10px}
  .pdv{font-family:var(--fdisp);font-weight:700;font-size:15px}
  .addr{font-size:12.5px;color:var(--muted);margin-top:2px}
  .addr a{color:var(--role);text-decoration:none;font-weight:600}
  .desc{font-size:13.5px;color:var(--ink-soft);margin-top:9px;line-height:1.5}
  .mat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .mat{display:inline-flex;align-items:center;gap:6px;background:var(--amber-weak);color:var(--amber-ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600}
  .mat b{font-family:var(--fdisp);font-weight:800}
  .badge{font-family:var(--fdisp);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:7px;white-space:nowrap}
  .chain{font-family:var(--fdisp);font-weight:800;font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-soft)}
  .chain.TAMBO{background:#fde5e5;color:#b02323}.chain.OXXO{background:#fde4d6;color:#b5560f}
  .chain.REPSOL{background:#fdecd2;color:#a06a06}.chain.PRIMAX{background:#dcf3e2;color:#127a3b}
  .time-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);color:var(--ink-soft);font-family:var(--fdisp);font-weight:700;font-size:12px;padding:3px 8px;border-radius:7px}
  .st1{background:var(--surface-3);color:var(--muted)}.st2{background:var(--brand-weak);color:var(--brand-ink)}.st3{background:var(--green-weak);color:var(--green-ink)}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .list-row:last-child{border-bottom:none}
  .list-row .nm{font-family:var(--fdisp);font-weight:700;font-size:14.5px}
  .qbox{font-family:var(--fdisp);font-weight:800;background:var(--role-weak);color:var(--role-ink);border-radius:9px;padding:6px 12px;font-size:16px;min-width:44px;text-align:center}
  .sech{font-family:var(--fdisp);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 2px 10px}
  .empty{text-align:center;padding:46px 24px;color:var(--muted)}
  .empty .ico{font-size:40px;opacity:.5;margin-bottom:8px}
  .empty h3{font-size:16px;color:var(--ink);margin-bottom:5px}
  .empty p{font-size:13.5px;max-width:40ch;margin:0 auto;line-height:1.55}
  .empty code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:12px}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-weight:600}
  .spin{width:34px;height:34px;border:3px solid var(--surface-3);border-top-color:var(--role);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><div>RutaMerch<small id="roleLbl">Vista general</small></div></div>
    <button class="refresh" onclick="load()" title="Actualizar">⟳</button>
  </div>
  <div class="subbar">
    <div class="seg">
      <button id="r-oficina" class="on" onclick="setRole('oficina')">Oficina</button>
      <button id="r-merch" onclick="setRole('merch')">Merch</button>
      <button id="r-almacen" onclick="setRole('almacen')">Almacén</button>
    </div>
    <span class="pick" id="merchPick" style="display:none"><label>Merch</label>
      <select id="merchSel" onchange="onMerch()"></select></span>
    <span class="pick"><label>Día</label><input type="date" id="dateSel" onchange="onDate()"></span>
  </div>
  <div class="body" id="body"><div class="loading"><div class="spin"></div>Cargando…</div></div>
</div>

<script>
/* ============================================================
   CONFIGURA AQUÍ tu Google Sheet publicado como CSV.
   Cómo obtenerlo:  en el Sheet ▸ Archivo ▸ Compartir ▸ Publicar en la web
   ▸ elige la pestaña PLANNING ▸ formato CSV ▸ Publicar ▸ copia el enlace.
   Pega ese enlace entre las comillas de abajo.
   ============================================================ */
var SHEET_CSV_URL = "PEGA_AQUI_TU_ENLACE_CSV";

var S = { role:'oficina', merch:'', date:'', merchs:[], rows:[], loading:true, error:'' };
var ROLE = {
  oficina:{lbl:'Vista general',accent:'--brand',weak:'--brand-weak',ink:'--brand-ink'},
  merch:{lbl:'Mi ruta',accent:'--teal',weak:'--teal-weak',ink:'--teal-ink'},
  almacen:{lbl:'Materiales',accent:'--amber',weak:'--amber-weak',ink:'--amber-ink'}
};
var CH = ['TAMBO','OXXO','REPSOL','PRIMAX','Otro'];
var COLS = {fecha:['fecha','date'],merch:['merch','usuario'],cadena:['cadena','chain'],pdv:['pdv','tienda'],
  direccion:['direccion','dirección','address'],hora:['hora','time'],descripcion:['descripcion','descripción','tarea'],
  materiales:['materiales','material'],estado:['estado','status']};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase()||'?';}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){var a=s.split('-');var d=new Date(+a[0],+a[1]-1,+a[2]);return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});}
function stClass(e){e=norm(e);return e.indexOf('complet')>=0?'3':e.indexOf('camino')>=0?'2':'1';}
function chBadge(c){return '<span class="chain '+(CH.indexOf(c)>=0?c:'')+'">'+esc(c||'PDV')+'</span>';}
function parseMats(str){if(!str)return[];return str.split(/[;\n]+/).map(function(s){return s.trim();}).filter(Boolean).map(function(p){var m=p.match(/^(.*?)\s*[x×]\s*(\d+)\s*$/i);return m?{name:m[1].trim(),qty:parseInt(m[2])||1}:{name:p,qty:1};});}
function matChips(str){var ms=parseMats(str);if(!ms.length)return '<div class="mat-list"><span style="font-size:12.5px;color:var(--faint)">Sin materiales</span></div>';return '<div class="mat-list">'+ms.map(function(m){return '<span class="mat"><b>'+esc(m.qty)+'</b> '+esc(m.name)+'</span>';}).join('')+'</div>';}
function routeSort(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');}

/* ---- CSV ---- */
function parseCSV(text){
  var rows=[],row=[],f='',i=0,q=false,c;
  while(i<text.length){c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
function colIndex(header){
  var idx={};header.forEach(function(h,i){var n=norm(h);
    for(var key in COLS){ if(COLS[key].indexOf(n)>=0 && idx[key]===undefined){ idx[key]=i; } }});
  return idx;
}
function normFecha(v){
  v=String(v||'').trim();
  var m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  var d=new Date(v);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return '';
}
function normHora(v){v=String(v||'').trim();var m=v.match(/^(\d{1,2}):(\d{2})/);return m?String(m[1]).padStart(2,'0')+':'+m[2]:v;}

function applyAccent(){var m=ROLE[S.role];var R=document.documentElement.style;
  R.setProperty('--role','var('+m.accent+')');R.setProperty('--role-weak','var('+m.weak+')');R.setProperty('--role-ink','var('+m.ink+')');
  document.getElementById('roleLbl').textContent=m.lbl;}

function load(){
  S.loading=true;S.error='';render();
  if(!SHEET_CSV_URL||SHEET_CSV_URL.indexOf('PEGA_AQUI')>=0){S.loading=false;S.error='config';return render();}
  var url=SHEET_CSV_URL+(SHEET_CSV_URL.indexOf('?')>=0?'&':'?')+'_cb='+Date.now();
  fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(txt){
    var rows=parseCSV(txt).filter(function(r){return r.some(function(c){return String(c).trim();});});
    if(!rows.length){S.rows=[];S.loading=false;return render();}
    var idx=colIndex(rows[0]);var g=function(r,k){return idx[k]!==undefined?r[idx[k]]:'';};
    S.rows=rows.slice(1).map(function(r){return {
      fecha:normFecha(g(r,'fecha')),merch:String(g(r,'merch')||'').trim(),cadena:String(g(r,'cadena')||'Otro').trim(),
      pdv:String(g(r,'pdv')||'').trim(),direccion:String(g(r,'direccion')||'').trim(),hora:normHora(g(r,'hora')),
      descripcion:String(g(r,'descripcion')||'').trim(),materiales:String(g(r,'materiales')||'').trim(),estado:String(g(r,'estado')||'').trim()
    };}).filter(function(t){return t.merch||t.pdv;});
    S.merchs=Array.from(new Set(S.rows.map(function(t){return t.merch;}).filter(Boolean))).sort();
    if(!S.merch&&S.merchs.length)S.merch=S.merchs[0];
    var sel=document.getElementById('merchSel');
    sel.innerHTML=S.merchs.map(function(n){return '<option'+(n===S.merch?' selected':'')+'>'+esc(n)+'</option>';}).join('');
    S.loading=false;render();
  }).catch(function(e){S.loading=false;S.error=e.message||'error';render();});
}

function setRole(r){S.role=r;['oficina','merch','almacen'].forEach(function(x){document.getElementById('r-'+x).className=(x===r?'on':'');});
  document.getElementById('merchPick').style.display=(r==='merch'?'':'none');applyAccent();render();}
function onMerch(){S.merch=document.getElementById('merchSel').value;render();}
function onDate(){S.date=document.getElementById('dateSel').value;render();}

function render(){
  applyAccent();
  var b=document.getElementById('body');
  if(S.loading){b.innerHTML='<div class="loading"><div class="spin"></div>Cargando…</div>';return;}
  if(S.error==='config'){b.innerHTML=empty('⚙️','Falta configurar el Sheet','Abre <code>index.html</code> y pega tu enlace CSV en <code>SHEET_CSV_URL</code>. Está explicado en el README.');return;}
  if(S.error){b.innerHTML=empty('⚠️','No se pudo cargar','Revisa que el Sheet esté <b>publicado en la web</b> como CSV y que el enlace sea correcto. ('+esc(S.error)+')');return;}
  if(S.role==='merch')b.innerHTML=viewMerch();
  else if(S.role==='almacen')b.innerHTML=viewAlmacen();
  else b.innerHTML=viewOficina();
}
function rowsForDate(){return S.rows.filter(function(t){return t.fecha===S.date;});}

function viewOficina(){
  var list=rowsForDate();var mats=0;list.forEach(function(t){parseMats(t.materiales).forEach(function(m){mats+=m.qty;});});
  var stats='<div class="stat-row"><div class="stat accent"><div class="n tnum">'+list.length+'</div><div class="l">Tareas</div></div>'+
    '<div class="stat"><div class="n tnum">'+new Set(list.map(function(t){return t.merch;})).size+'</div><div class="l">Merch</div></div>'+
    '<div class="stat"><div class="n tnum">'+mats+'</div><div class="l">Materiales</div></div></div>';
  var head='<div class="sech">'+fmtDate(S.date)+'</div>';
  if(!list.length)return stats+head+empty('🗺️','Sin tareas este día','Llena la pestaña PLANNING de tu Google Sheet para ver la programación aquí.');
  return stats+head+groupByMerch(list,false);
}
function viewMerch(){
  if(!S.merch)return empty('👤','Elige tu nombre','Selecciona tu nombre arriba para ver tu ruta.');
  var mine=rowsForDate().filter(function(t){return norm(t.merch)===norm(S.merch);}).sort(routeSort);
  var head='<div class="stat-row" style="grid-template-columns:1fr 1fr"><div class="stat accent"><div class="n tnum">'+mine.length+'</div><div class="l">Tiendas hoy</div></div>'+
    '<div class="stat"><div class="n" style="font-size:16px;padding-top:4px">'+esc(S.merch)+'</div><div class="l">Merch</div></div></div>';
  if(!mine.length)return empty('☕','Sin ruta asignada','No tienes tiendas para '+fmtDate(S.date)+'. Revisa otro día.');
  return head+mine.map(function(t,i){return taskCard(t,i+1);}).join('');
}
function taskCard(t,n){
  var maps=t.direccion?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t.direccion):null;
  return '<div class="task card s'+stClass(t.estado)+'"><div class="t-top">'+
    '<div class="avatar" style="background:var(--role-weak);color:var(--role-ink)">'+n+'</div><div style="flex:1">'+
    '<div style="display:flex;gap:7px;align-items:center;margin-bottom:4px;flex-wrap:wrap">'+chBadge(t.cadena)+(t.hora?'<span class="time-chip">🕒 '+esc(t.hora)+'</span>':'')+(t.estado?'<span class="badge st'+stClass(t.estado)+'">'+esc(t.estado)+'</span>':'')+'</div>'+
    '<div class="pdv">'+esc(t.pdv)+'</div>'+(t.direccion?'<div class="addr">📍 '+esc(t.direccion)+(maps?' · <a href="'+maps+'" target="_blank" rel="noopener">Mapa</a>':'')+'</div>':'')+
    '</div></div>'+(t.descripcion?'<div class="desc">'+esc(t.descripcion)+'</div>':'')+
    '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:12px;font-family:var(--fdisp)">Materiales a recoger</div>'+matChips(t.materiales)+'</div>';
}
function viewAlmacen(){
  var list=rowsForDate().filter(function(t){return t.materiales;});
  if(!list.length)return empty('📦','Nada que preparar','No hay materiales solicitados para '+fmtDate(S.date)+'.');
  var units=0;list.forEach(function(t){parseMats(t.materiales).forEach(function(m){units+=m.qty;});});
  var stats='<div class="stat-row"><div class="stat accent"><div class="n tnum">'+units+'</div><div class="l">Unidades</div></div>'+
    '<div class="stat"><div class="n tnum">'+new Set(list.map(function(t){return t.merch;})).size+'</div><div class="l">Merch</div></div>'+
    '<div class="stat"><div class="n tnum">'+list.length+'</div><div class="l">Tiendas</div></div></div>';
  var agg={};list.forEach(function(t){parseMats(t.materiales).forEach(function(m){agg[m.name]=(agg[m.name]||0)+m.qty;});});
  var cons=Object.keys(agg).map(function(k){return {name:k,qty:agg[k]};}).sort(function(a,b){return b.qty-a.qty;});
  var consHtml='<div class="sech">Total a picar · '+fmtDate(S.date)+'</div><div class="card">'+cons.map(function(m){
    return '<div class="list-row"><div class="qbox tnum">'+m.qty+'</div><div style="flex:1"><div class="nm">'+esc(m.name)+'</div></div></div>';}).join('')+'</div>';
  return stats+consHtml+'<div class="sech" style="margin-top:20px">Kit por merch</div>'+groupByMerch(list,true);
}
function groupByMerch(list,warehouse){
  var by={};list.forEach(function(t){(by[t.merch]=by[t.merch]||[]).push(t);});
  return Object.keys(by).sort().map(function(mid){
    var ts=by[mid].sort(routeSort);var extra='';
    if(warehouse){var u=0;ts.forEach(function(t){parseMats(t.materiales).forEach(function(m){u+=m.qty;});});extra=u+' unidad'+(u!==1?'es':'')+' · ';}
    var head='<div class="group-head"><div class="avatar">'+initials(mid)+'</div><div><div class="nm">'+esc(mid)+'</div>'+
      '<div class="meta">'+extra+ts.length+' tienda'+(ts.length!==1?'s':'')+'</div></div><span class="count-pill">'+ts.length+'</span></div>';
    var cards=ts.map(function(t){
      return '<div class="task card s'+stClass(t.estado)+'"><div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap">'+
        chBadge(t.cadena)+(t.hora?'<span class="time-chip">🕒 '+esc(t.hora)+'</span>':'')+'<span class="pdv" style="font-size:14px">'+esc(t.pdv)+'</span>'+
        (t.estado?'<span class="badge st'+stClass(t.estado)+'" style="margin-left:auto">'+esc(t.estado)+'</span>':'')+'</div>'+
        (!warehouse&&t.descripcion?'<div class="desc">'+esc(t.descripcion)+'</div>':'')+matChips(t.materiales)+'</div>';
    }).join('');
    return '<div class="group">'+head+cards+'</div>';
  }).join('');
}
function empty(ico,title,txt){return '<div class="card"><div class="empty"><div class="ico">'+ico+'</div><h3>'+esc(title)+'</h3><p>'+txt+'</p></div></div>';}

S.date=today();document.getElementById('dateSel').value=S.date;
load();
</script>
